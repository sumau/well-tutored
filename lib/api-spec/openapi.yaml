openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tutors
    description: Public tutor profiles
  - name: resources
    description: Tutor-written resources
  - name: enquiries
    description: Named-tutor enquiries
  - name: workspace
    description: Authenticated tutor publishing workspace
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tutors:
    get:
      operationId: listTutors
      tags: [tutors]
      summary: List available tutors
      responses:
        "200":
          description: Tutor profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tutor"
  /tutors/{slug}:
    get:
      operationId: getTutor
      tags: [tutors]
      summary: Get a tutor profile
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Tutor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tutor"
        "404":
          $ref: "#/components/responses/NotFound"
  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List tutor-written resources
      parameters:
        - name: subject
          in: query
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 9
      responses:
        "200":
          description: Resource summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePage"
  /resources/{slug}:
    get:
      operationId: getResource
      tags: [resources]
      summary: Get a full tutor-written resource
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspace/saved-resources:
    get:
      operationId: listSavedResources
      tags: [workspace]
      summary: List resources saved by the current account
      responses:
        "200":
          description: Saved resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /workspace/saved-resources/{id}:
    put:
      operationId: saveResource
      tags: [workspace]
      summary: Save a published resource for the current account
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Resource saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedResourceState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unsaveResource
      tags: [workspace]
      summary: Remove a resource from the current account's saved list
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Resource removed from saved list
        "401":
          $ref: "#/components/responses/Unauthorized"
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Submit a named-tutor enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryReceipt"
        "400":
          description: Invalid enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /workspace/enquiries:
    get:
      operationId: listWorkspaceEnquiries
      tags: [workspace]
      summary: List enquiries visible to the current staff account
      responses:
        "200":
          description: Staff enquiry inbox
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceEnquiry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /workspace/enquiries/{id}/retry:
    post:
      operationId: retryWorkspaceEnquiry
      tags: [workspace]
      summary: Retry delivery of a failed enquiry
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Enquiry delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceEnquiry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Delivery is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /workspace/me:
    get:
      operationId: getWorkspaceSession
      tags: [workspace]
      summary: Get or provision the authenticated workspace account
      responses:
        "200":
          description: Workspace session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /workspace/resources:
    get:
      operationId: listWorkspaceResources
      tags: [workspace]
      summary: List resources editable by the current account
      responses:
        "200":
          description: Editable resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceResource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWorkspaceResource
      tags: [workspace]
      summary: Create a tutor resource draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceResourceInput"
      responses:
        "201":
          description: Resource draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResource"
        "400":
          description: Invalid resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /workspace/resources/{id}:
    patch:
      operationId: updateWorkspaceResource
      tags: [workspace]
      summary: Update an owned resource
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceResourceUpdate"
      responses:
        "200":
          description: Resource updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResource"
        "400":
          description: Invalid resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteWorkspaceResource
      tags: [workspace]
      summary: Delete an owned resource
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Resource deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspace/profile:
    patch:
      operationId: updateWorkspaceProfile
      tags: [workspace]
      summary: Update the current tutor profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorProfileUpdate"
      responses:
        "200":
          description: Tutor profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTutor"
        "400":
          description: Invalid profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /workspace/profile/draft:
    delete:
      operationId: discardWorkspaceProfileDraft
      tags: [workspace]
      summary: Discard the current tutor profile draft
      responses:
        "200":
          description: Draft discarded and published profile returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTutor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No published profile exists to restore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /workspace/tutors:
    get:
      operationId: listWorkspaceTutors
      tags: [workspace]
      summary: List tutor profiles for owner management
      responses:
        "200":
          description: Tutor profiles, including drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceTutor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWorkspaceTutor
      tags: [workspace]
      summary: Create a tutor profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorStubInput"
      responses:
        "201":
          description: Tutor profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTutor"
        "400":
          description: Invalid tutor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /workspace/tutors/{id}:
    post:
      operationId: archiveWorkspaceTutor
      tags: [workspace]
      summary: Archive a tutor profile
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Tutor profile archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTutor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: restoreWorkspaceTutor
      tags: [workspace]
      summary: Restore an archived tutor profile
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Tutor profile restored as a draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTutor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteWorkspaceTutor
      tags: [workspace]
      summary: Permanently delete a tutor profile (exceptional)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Tutor profile deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspace/accounts:
    get:
      operationId: listWorkspaceAccounts
      tags: [workspace]
      summary: List tutor workspace accounts for owner management
      responses:
        "200":
          description: Workspace accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /workspace/accounts/{id}:
    delete:
      operationId: deleteWorkspaceAccount
      tags: [workspace]
      summary: Delete a workspace account
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Workspace account deleted
        "400":
          description: The owner account cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateWorkspaceAccount
      tags: [workspace]
      summary: Approve, assign, or revoke a workspace account
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceAccountUpdate"
      responses:
        "200":
          description: Workspace account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAccount"
        "400":
          description: Invalid account assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Tutor:
      type: object
      required: [id, slug, name, firstName, lastName, initials, subject, support, profileSummary, university, qualification, bio, style, teachingIntro, teachingPoints, rate, availability, tint, resources]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        initials: { type: string }
        subject: { type: string }
        support: { type: string }
        profileSummary: { type: string, maxLength: 200 }
        university: { type: string }
        qualification: { type: string }
        bio: { type: string }
        style: { type: string }
        teachingIntro: { type: string }
        teachingPoints:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TeachingPoint"
        rate: { type: number }
        availability: { type: string, enum: [accepting, limited, unavailable] }
        tint: { type: string }
        resources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
    WorkspaceTutor:
      type: object
      required: [id, slug, name, firstName, lastName, initials, subject, support, profileSummary, university, qualification, bio, style, teachingIntro, teachingPoints, profileStatus, rate, availability, tint, resources]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        initials: { type: string }
        subject: { type: string }
        support: { type: string }
        profileSummary: { type: string, maxLength: 200 }
        university: { type: string }
        qualification: { type: string }
        bio: { type: string }
        style: { type: string }
        teachingIntro: { type: string }
        teachingPoints:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceTeachingPoint"
        profileStatus: { type: string, enum: [draft, published, archived] }
        rate: { type: number }
        availability: { type: string, enum: [accepting, limited, unavailable] }
        tint: { type: string }
        resources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
    Resource:
      type: object
      required: [id, slug, title, tutorSlug, tutorName, tutorTint, subject, level, type, readMinutes, excerpt, publishedAt, tint]
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        tutorSlug: { type: string }
        tutorName: { type: string }
        tutorTint: { type: string }
        subject: { type: string }
        level: { type: string }
        type: { $ref: "#/components/schemas/ResourceType" }
        readMinutes: { type: integer }
        excerpt: { type: string }
        publishedAt: { type: string, format: date }
        tint: { type: string }
    ResourcePage:
      type: object
      required: [items, page, pageSize, total, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        hasMore: { type: boolean }
    ResourceDetail:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [body, sections, related]
          properties:
            body: { type: string }
            sections:
              type: array
              items:
                $ref: "#/components/schemas/ResourceSection"
            related:
              type: array
              items:
                $ref: "#/components/schemas/Resource"
    ResourceType:
      type: string
      enum: [Study note, Guide, Essay, Revision notes]
    SavedResourceState:
      type: object
      required: [resourceId, saved]
      properties:
        resourceId: { type: integer }
        saved: { type: boolean }
    WorkspaceSession:
      type: object
      required: [id, role, email, displayName, availableTutorAccents]
      properties:
        id: { type: integer }
        role: { type: string, enum: [owner, tutor, pending] }
        email: { type: string }
        displayName: { type: string }
        availableTutorAccents:
          type: array
          items:
            type: string
            enum: ["#D98F7F", "#D8B267", "#B5A1CC", "#83B7B0", "#9DBB83", "#8EA8CE", "#C98B9B", "#A88DBD", "#7FA6A0", "#8B9FC2", "#D08C76", "#C2A06E", "#B48C9E", "#8C8FB5", "#73A9A1", "#8FAE7E", "#A997C7", "#7899B5", "#C18A9A", "#9C9A72"]
        tutor:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceTutor"
            - type: "null"
    WorkspaceAccount:
      type: object
      required: [id, role, email, displayName, tutorProfileStatus]
      properties:
        id: { type: integer }
        role: { type: string, enum: [owner, tutor, pending] }
        email: { type: string }
        displayName: { type: string }
        tutorId: { type: ["integer", "null"] }
        tutorName: { type: ["string", "null"] }
        tutorProfileStatus: { type: ["string", "null"] }
    WorkspaceAccountUpdate:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [owner, tutor, pending] }
        tutorId: { type: ["integer", "null"] }
    WorkspaceResource:
      type: object
      required: [id, slug, tutorId, tutorName, title, subject, level, type, readMinutes, excerpt, body, sections, publishedAt, tint, status]
      properties:
        id: { type: integer }
        slug: { type: string }
        tutorId: { type: integer }
        tutorName: { type: string }
        title: { type: string }
        subject: { type: string }
        level: { type: string }
        type: { $ref: "#/components/schemas/ResourceType" }
        readMinutes: { type: integer }
        excerpt: { type: string }
        body: { type: string }
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ResourceSection"
        publishedAt: { type: string, format: date }
        tint: { type: string }
        status: { type: string, enum: [draft, published] }
    WorkspaceResourceInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 3 }
        subject: { type: string }
        level: { type: string }
        type:
          $ref: "#/components/schemas/ResourceType"
        excerpt: { type: string }
        body: { type: string }
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ResourceSection"
    WorkspaceResourceUpdate:
      type: object
      properties:
        title: { type: string, minLength: 3 }
        subject: { type: string }
        level: { type: string }
        type:
          $ref: "#/components/schemas/ResourceType"
        excerpt: { type: string }
        body: { type: string }
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ResourceSection"
        status: { type: string, enum: [draft, published] }
    TutorProfileUpdate:
      type: object
      properties:
        name: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        initials: { type: string, maxLength: 4 }
        subject: { type: string }
        support: { type: string }
        profileSummary: { type: string, maxLength: 200 }
        university: { type: string }
        qualification: { type: string }
        bio: { type: string }
        style: { type: string }
        teachingIntro: { type: string, maxLength: 200 }
        teachingPoints:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/WorkspaceTeachingPoint"
        rate: { type: number, minimum: 0 }
        availability: { type: string, enum: [accepting, limited, unavailable] }
        tint:
          type: string
          enum: ["#D98F7F", "#D8B267", "#B5A1CC", "#83B7B0", "#9DBB83", "#8EA8CE", "#C98B9B", "#A88DBD", "#7FA6A0", "#8B9FC2", "#D08C76", "#C2A06E", "#B48C9E", "#8C8FB5", "#73A9A1", "#8FAE7E", "#A997C7", "#7899B5", "#C18A9A", "#9C9A72"]
        status: { type: string, enum: [draft, published] }
    TutorStubInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2 }
    ResourceSection:
      type: object
      required: [id, heading, body]
      properties:
        id: { type: string }
        heading: { type: string }
        body: { type: string }
    TeachingPoint:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 2 }
        body: { type: string, minLength: 10 }
    WorkspaceTeachingPoint:
      type: object
      required: [title, body]
      properties:
        title: { type: string }
        body: { type: string }
    EnquiryInput:
      type: object
      required: [name, email, tutorSlug, studentName, studentAge, subjectLevel, message]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, minLength: 3 }
        tutorSlug: { type: string, minLength: 1 }
        studentName: { type: string, minLength: 1 }
        studentAge: { type: string, minLength: 1 }
        subjectLevel: { type: string, minLength: 1 }
        message: { type: string, minLength: 10 }
    EnquiryReceipt:
      type: object
      required: [id, tutorName, receivedAt, deliveryStatus, message]
      properties:
        id: { type: integer }
        tutorName: { type: string }
        receivedAt: { type: string, format: date-time }
        deliveryStatus:
          $ref: "#/components/schemas/EnquiryDeliveryStatus"
        message: { type: string }
    EnquiryDeliveryStatus:
      type: string
      enum: [pending, delivered, failed]
    WorkspaceEnquiry:
      type: object
      required: [id, tutorId, tutorName, name, email, studentName, studentAge, subjectLevel, message, deliveryStatus, createdAt]
      properties:
        id: { type: integer }
        tutorId: { type: integer }
        tutorName: { type: string }
        name: { type: string }
        email: { type: string }
        studentName: { type: string }
        studentAge: { type: string }
        subjectLevel: { type: string }
        message: { type: string }
        deliveryStatus:
          $ref: "#/components/schemas/EnquiryDeliveryStatus"
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

