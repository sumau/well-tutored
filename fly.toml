# Fly.io deployment for Well Tutored. One machine serving the frontend and the
# API from a single origin. The database is external and reached through the
# DATABASE_URL secret. See docs/deploy.md for the full walkthrough, including
# the secrets this file deliberately omits.
#
# Create the app with `fly apps create`, which only reserves the name; `fly
# launch` rewrites this file from its own guesses. Update `app` and
# TRUSTED_ORIGINS together — they must name the same hostname.

app = "well-tutored"
primary_region = "lhr"

[build]
  dockerfile = "docker/Dockerfile"

  [build.args]
    # Read by the browser bundle, so it has to be present at build time rather
    # than set as a secret. Publishable keys are public values. Leave it empty
    # to deploy the public site without workspace sign-in.
    VITE_CLERK_PUBLISHABLE_KEY = "pk_test_cHJvbW90ZWQtY295b3RlLTM5MTAuY2xlcmsuYWNjb3VudHMuZGV2JA"

[env]
  PORT = "8080"
  # The exact public origin. Nothing infers it, and an empty
  # trusted-origin set rejects every credentialed request, enquiries included.
  TRUSTED_ORIGINS = "https://well-tutored.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
