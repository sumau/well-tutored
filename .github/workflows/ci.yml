# Deterministic repository verification, as defined by `pnpm run verify:ci`,
# and then the deploy. docs/ci-validation.md is the description of what the
# verification gate covers and why; this file only supplies the environment it
# needs.
#
# Deliberately absent: the development smoke check, which depends on a live
# Replit development domain and stays in the Replit `Project` workflow, and
# the Playwright enquiry smoke, which needs a browser. No Clerk credentials
# for `verify` either: the suite is expected to pass with CLERK_SECRET_KEY,
# CLERK_PUBLISHABLE_KEY, and VITE_CLERK_PUBLISHABLE_KEY all absent, so giving
# CI secrets would weaken that guarantee rather than test it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify:ci
    # ubuntu-latest is linux-x64/glibc. pnpm-workspace.yaml prunes every other
    # platform's native binaries (esbuild, lightningcss, @tailwindcss/oxide,
    # rollup) from the lockfile, so an arm runner or a musl container could not
    # resolve an install. Same constraint the dev image documents.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: well_tutored
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d well_tutored"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30

    env:
      # Both connections are set, and set differently, so lib/db/src/index.ts's
      # refusal to run integration tests against the application database is
      # exercised rather than trivially satisfied by an absent DATABASE_URL.
      # Nothing writes to well_tutored; it exists to be the URL the guard
      # compares against.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/well_tutored
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/well_tutored_test

    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: the action reads the "packageManager" pin
      # from package.json, which docker/Dockerfile.dev also tracks. One pin,
      # three environments.
      - uses: pnpm/action-setup@v4

      # Must come after pnpm/action-setup so `cache: pnpm` can find the store.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Supplying TEST_DATABASE_URL takes the short branch of
      # scripts/with-test-database.sh, which skips building a throwaway
      # cluster. The database it names has to exist first: prepare:test-database
      # applies a schema through drizzle-kit, which cannot create the database
      # that holds it.
      - name: Create the integration-test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'CREATE DATABASE well_tutored_test'

      # Runs the guard tests, the test-database checks, schema preparation, the
      # API suite (including the database-backed workspace lifecycle tests), the
      # web tests, the smoke-check tests, and finally `pnpm run build` — which
      # is where docs:check and the full typecheck live, so a doc edit that
      # would break the Replit deployment build fails here instead.
      - name: Verify
        run: pnpm run verify:ci

  # Merging to main ships. Nothing else does: a pull request run stops at
  # `verify`, and `needs` keeps a failed verification from deploying.
  deploy:
    name: deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Its own group, and without cancel-in-progress. The workflow-level group
    # cancels superseded pull-request runs, which is right for verification and
    # wrong here: a cancelled deploy leaves the Deployment wherever flyctl had
    # got to. Queue them instead.
    concurrency:
      group: deploy-well-tutored

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # No build arguments: fly.toml already carries
      # VITE_CLERK_PUBLISHABLE_KEY under [build.args], which is where it
      # belongs — Vite compiles it into the browser bundle at build time, so a
      # Fly secret would not exist yet.
      #
      # This does not apply the schema. Pushing it is a deliberate, separate
      # act — see docs/adr/0002-schema-by-deliberate-push.md.
      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A Deploy succeeding does not mean the Deployment is usable. The launch
      # smoke is fetch-based, so no browser is needed here.
      #
      # "incomplete" is the two conditions this Deployment is still in, each
      # waived by its own flag in the script and each with its own end: it has
      # no published content, and its Clerk instance is a development one. When
      # the last flag goes, this becomes `pnpm run smoke:launch` and the two
      # script entries go with it.
      - name: Launch smoke
        env:
          SMOKE_BASE_URL: https://well-tutored.fly.dev
        run: pnpm run smoke:launch:incomplete
